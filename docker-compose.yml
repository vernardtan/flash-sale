name: flash-sale

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-flash_sale}
      POSTGRES_USER: ${DATABASE_USER:-flash_sale}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-flash_sale_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside the compose network, dependencies are reached by service name.
      # These overrides keep the container correct even if .env points at
      # localhost for host-side tooling (prisma migrate, tests).
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${DATABASE_USER:-flash_sale}:${DATABASE_PASSWORD:-flash_sale_dev}@postgres:5432/${DATABASE_NAME:-flash_sale}?connection_limit=${DATABASE_CONNECTION_LIMIT:-20}&pool_timeout=${DATABASE_POOL_TIMEOUT:-30}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend via the published host port.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
